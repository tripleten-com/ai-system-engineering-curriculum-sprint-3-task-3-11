# Coldline - Task 3.11
# File: submission.yaml
# Component: Student answer sheet
# Purpose: Record the figures from your own three provider runs and the structured primary and fallback decision.
# Interacts With: Submission schema, public verifier, provider contract checks, protected answer key
# Sprint/Task: Sprint 3 - Project 3 / Task 3.11
# Concepts: Model provider adapters, conformance, latency percentiles, primary and fallback
# Tools: YAML

# Complete submission.yaml from your own runs and the sources named beside each answer group.
# Keep the supplied keys; replace empty strings and zeros using each field's stated type.
# Empty values and placeholder text fail verification.
# Use submission-sample.yaml for format only; do not copy its fictional values.
# Do not include secrets, personal data, endpoint URLs, or local absolute paths.

answers:
  # Task 3.11 — Steps 3 and 4: the three runs
  # Source: docs/student/providers/<name>-latency.json, exactly as `poe provider-latency`
  # wrote them (emulator-latency.json, hosted-fixture-latency.json, ollama-latency.json).
  # Each entry has the same five fields:
  #   status: ran | not_run
  #   p50_ms, p95_ms: the file's p50_ms and p95_ms, whole milliseconds
  #   retryable_errors, terminal_errors: the file's counts, whole numbers
  # Copy every figure as written; do not round or "clean" it, the check compares them
  # exactly. emulator and hosted_fixture are `ran` from Step 3. ollama is `ran` with the
  # figures from your own manual Ollama run (Step 4), or `not_run` with all four figures
  # set to null and no ollama-latency.json committed.
  runs:
    emulator:
      status: "ran"
      p50_ms: 256
      p95_ms: 264
      retryable_errors: 0
      terminal_errors: 0
    hosted_fixture:
      status: "ran"
      p50_ms: 654
      p95_ms: 1645
      retryable_errors: 1
      terminal_errors: 0
    ollama:
      status: "ran"
      p50_ms: 4358
      p95_ms: 6730
      retryable_errors: 0
      terminal_errors: 0

  # Task 3.11 — Step 5: the primary and fallback decision
  # primary, fallback: ollama | hosted_api | emulator, and they must differ.
  #   hosted_api means the hosted provider your fixture was recorded from; ollama means a
  #   self-hosted Ollama; emulator means the deterministic local provider the worker calls
  #   today.
  # fallback_trigger: retry_budget_exhausted | latency_over_budget | provider_unreachable
  #   the condition the worker would switch on: the resilient wrapper raised
  #   RetryableProviderError after spending its attempts on the primary; the primary's p95
  #   in your runs is above the worker's per-attempt timeout; or the primary refused the
  #   connection before any attempt ran. Pick the one your figures and your Step 2
  #   classification would produce.
  # notes: at most 600 characters: the provider on the fixture's first line, one limit of
  #   what your runs prove about each of the primary and the fallback, and whether a server
  #   built for serving open models (vLLM, for example) would change your choice and why.
  primary: "hosted_api"
  fallback: "ollama"
  fallback_trigger: "retry_budget_exhausted"
  notes: "Fixture line 1: Tessellate Inference API (tessellate-summarize-1), a synthetic one-afternoon replay, so it proves the comparison, not that provider's real availability, quota or cost. My Ollama p50 4358/p95 6730 ms measures one CPU-only laptop with the whole stack running; it proves the adapter speaks the protocol, not what self-hosting would cost. Hosted p95 1645 ms is inside the worker's 2000 ms per-attempt timeout; Ollama's p50 is over twice it, so it is a reserve, not a peer. A vLLM-style server attacks exactly that latency, so it could change the choice, but I measured none."
